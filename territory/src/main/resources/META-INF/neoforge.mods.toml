modLoader = "javafml"
loaderVersion = "[4,)"
license = "GPL-3.0-only"
issueTrackerURL = "https://github.com/leon-o/MineTerritory/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
displayURL = "https://github.com/leon-o/MineTerritory"

# NeoForge + Minecraft
[[dependencies.territory]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.territory]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Easy Factions backs every claim: this mod drives its ClaimManager instead of MineTerritory's banner power.
[[dependencies.territory]]
modId = "easy_factions"
type = "required"
versionRange = "[1.0,)"
ordering = "AFTER"
side = "BOTH"
