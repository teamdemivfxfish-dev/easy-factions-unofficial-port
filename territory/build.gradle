plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
}

configurations {
    renamer
}

sourceSets {
    corePatch {
        java.srcDir '../core/patches'
    }
    tools {
        java.srcDir 'tools'
    }
}

def releasedCore = file('libs/core-released.jar')
def renamedCore = layout.buildDirectory.file('renamed/core.jar').get().asFile

dependencies {
    renamer 'org.ow2.asm:asm-commons:9.8'
}

sourceSets.tools.compileClasspath = configurations.renamer

def renameCore = tasks.register('renameCore', JavaExec) {
    group = 'build'
    description = 'Renames the released core (package, mod id, strings, resources) into build/renamed/core.jar.'
    dependsOn 'toolsClasses'
    classpath = sourceSets.tools.output + configurations.renamer
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    mainClass = 'RenameCore'
    args releasedCore.absolutePath, renamedCore.absolutePath
    inputs.file releasedCore
    inputs.files sourceSets.tools.output
    outputs.file renamedCore
}

dependencies {
    compileOnly files(renamedCore) {
        builtBy renameCore
    }
}

neoForge {
    version = neoforge_version
    mods {
        holdfast_factions {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.corePatch.compileClasspath = sourceSets.main.compileClasspath + sourceSets.main.output

tasks.named('processResources', ProcessResources).configure {
    var props = [
            minecraft_version_range: minecraft_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties props
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand props
    }
}

tasks.named('jar') {
    enabled = false
}

tasks.register('mergedJar', Jar) {
    group = 'build'
    description = 'The single Holdfast Factions jar: the renamed core, its patched classes and the Territory Table.'
    dependsOn 'classes', 'corePatchClasses', renameCore
    archiveBaseName = 'holdfast_factions-neoforge'
    archiveVersion = mod_version
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from(sourceSets.corePatch.output)
    from(sourceSets.main.output) {
        exclude 'pack.mcmeta'
    }
    from(zipTree(renamedCore)) {
        exclude 'data/minecraft/tags/block/mineable/pickaxe.json'
        exclude 'assets/holdfast_factions/lang/en_us.json'
        exclude 'dev/xmat5/holdfast/server/claims/ChunkClaimSelectionManager*.class'
        exclude 'dev/xmat5/holdfast/server/claims/ClaimCommands*.class'
        exclude 'dev/xmat5/holdfast/server/event_handlers/ClaimEventHandler*.class'
        exclude 'dev/xmat5/holdfast/server/ServerConfig*.class'
        exclude 'dev/xmat5/holdfast/objective/ObjectiveConfig*.class'
        exclude 'dev/xmat5/holdfast/client/ClientConfig*.class'
    }
}

tasks.named('assemble') {
    dependsOn 'mergedJar'
}
