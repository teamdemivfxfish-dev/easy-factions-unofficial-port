plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
}

neoForge {
    version = neoforge_version
    mods {
        territory {
            sourceSet sourceSets.main
        }
    }
    // Headless boot verification: ./gradlew runServer --offline
    // run/mods must hold the Easy Factions jar with the territory trees STRIPPED OUT (this run supplies
    // territory from the source set, and two copies of one modid is a hard crash at mod discovery), plus
    // MineColonies with structurize + blockui + domum_ornamentum if colony behaviour is being checked.
    // What this proves is that every class loads and the startup reports say what they should; in-world
    // behaviour still needs real players.
    runs {
        server {
            server()
            programArguments.addAll '--nogui'
        }
    }
}

dependencies {
    // Easy Factions provides the claim + faction API at runtime; compileOnly because it is a SEPARATE
    // jar (this mod is GPLv3 and is NOT bundled into the MPL Easy Factions jar). Players install both.
    compileOnly files('libs/easy_factions-NeoForge-1.0.0.jar')
    // SDM Economy is the default currency for the "Buy Claims" button (optional soft-dep). compileOnly:
    // never bundled, only touched after ModList.isLoaded("sdmeconomy"); absent -> emerald fallback.
    compileOnly files('libs/sdmeconomy-neoforge-1.21.1-2.4.0.jar')
    // MineColonies outranks every faction claim: a colony's own chunks answer to the colony, not to whoever
    // painted a claim over them. compileOnly + guarded by ModList.isLoaded("minecolonies"), so a server
    // without it simply never reaches the code. Never bundled.
    compileOnly files('libs/minecolonies-1.1.1357-1.21.1-snapshot.jar')
}

tasks.named('processResources', ProcessResources).configure {
    var props = [
            minecraft_version_range: minecraft_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties props
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand props
    }
}
