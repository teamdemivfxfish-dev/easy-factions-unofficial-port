modLoader = "javafml"
loaderVersion = "[4,)"
license = "MPL-2.0"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# The host: at release these classes live inside the Easy Factions port jar, so it is always present.
[[dependencies.${mod_id}]]
modId = "easy_factions"
type = "required"
versionRange = "[1.0,)"
ordering = "AFTER"
side = "BOTH"

# Optional economy backend for /factionbuy. Absent = paid claims disabled, nothing else affected.
[[dependencies.${mod_id}]]
modId = "sdmeconomy"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
